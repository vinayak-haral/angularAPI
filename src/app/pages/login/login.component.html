  <mat-card>
    <mat-card-content>
      <form  [formGroup]="loginForm"  (ngSubmit)="onSubmit()">
        <h2>Log In</h2>
        <mat-form-field>
          <input matInput placeholder="Email" formControlName="username" name="username" required>
          <mat-error>
            Please provide a valid email address
          </mat-error>
        </mat-form-field>
        <mat-form-field>
          <input matInput type="password" placeholder="Password" formControlName="password" name="password" required>
          <mat-error>
            Please provide a valid password
          </mat-error>
        </mat-form-field>
        <!-- <div *ngIf="this.errorMessage" style="margin-bottom: 10px;">
          <span class="error">
              {{this.errorMessage}}
          </span>
      </div> -->
      <mat-error *ngIf="errorMessage">
        The username and password were not recognized.
      </mat-error>
        <button mat-raised-button color="primary" [disabled]="!loginForm.valid">Login</button>
      </form>
    </mat-card-content>
  </mat-card>



</div>

<div class="login-viewport">
  <div class="login-card k-card" role="region" aria-labelledby="loginTitle">
    <div class="card-decor"></div>

    <header class="k-card-header">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">🔒</span>
        <div>
          <h2 id="loginTitle" class="card-title">Welcome back</h2>
          <p class="card-subtitle">Sign in to continue</p>
        </div>
      </div>
    </header>

    <div class="k-card-body">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <label class="k-label" for="username">Email</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">✉️</span>
          <input id="username" type="email" class="k-textbox k-input" placeholder="you@company.com"
                 formControlName="username" required aria-required="true" />
        </div>
        <div class="field-error" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" role="alert">
          Please provide a valid email address
        </div>

        <label class="k-label" for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">🔑</span>
          <input id="password" [type]="showPassword ? 'text' : 'password'" class="k-textbox k-input"
                 placeholder="••••••••" formControlName="password" required aria-required="true" />
          <button type="button" class="toggle-pass" (click)="showPassword = !showPassword" [attr.aria-pressed]="showPassword">
            <span *ngIf="!showPassword">👁️</span>
            <span *ngIf="showPassword">🙈</span>
          </button>
        </div>
        <div class="field-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" role="alert">
          Please provide a valid password
        </div>

        <div class="row-between">
          <label class="remember">
            <input type="checkbox" formControlName="remember" />
            <span>Remember me</span>
          </label>
          <a class="link" href="/forgot">Forgot password?</a>
        </div>

        <div class="error-message" *ngIf="errorMessage" role="alert">
          The username and password were not recognized.
        </div>

        <div class="actions" >
          <button kendoButton themeColor="primary" [disabled]="!loginForm.valid" class="k-button k-primary btn-primary"
          style="background: linear-gradient(135deg, #3f51b5 0%, #303f9f 100%);">
            Login
          </button>
        </div>

        <div class="divider"><span>or continue with</span></div>

        <div class="socials">
          <button class="social-btn google" aria-label="Sign in with Google">G</button>
          <button class="social-btn microsoft" aria-label="Sign in with Microsoft">M</button>
          <button class="social-btn github" aria-label="Sign in with GitHub">GH</button>
        </div>
      </form>
    </div>

    <footer class="k-card-footer small-note">
      <span>New here?</span>
      <a class="link" (click)="openSignup()">Create an account</a>
    </footer>
  </div>
</div>
